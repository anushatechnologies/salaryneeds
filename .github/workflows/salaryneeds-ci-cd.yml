name: SalaryNeeds CI/CD

on:
  push:
    branches:
      - master
      - main

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Build Spring Boot application
      - name: Build application
        run: mvn clean package -DskipTests

      # 4. Stop application and remove old JAR
      - name: Prepare EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Stopping SalaryNeeds..."
            sudo systemctl stop salaryneeds || true

            echo "Ensuring directory exists and setting permissions..."
            sudo mkdir -p /opt/salaryneeds
            sudo chown -R ec2-user:ec2-user /opt/salaryneeds

            echo "Removing old JAR..."
            sudo rm -f /opt/salaryneeds/salaryneeds-0.0.1-SNAPSHOT.jar
            sudo rm -rf /opt/salaryneeds/target

            echo "Checking directory..."
            ls -lh /opt/salaryneeds

      # 5. Copy new JAR directly to EC2
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/salaryneeds-0.0.1-SNAPSHOT.jar"
          target: "/opt/salaryneeds"
          strip_components: 1
          overwrite: true

      # 6. Start application and verify health
      - name: Start and verify SalaryNeeds
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Fallback in case scp placed the jar inside a target/ subfolder
            if [ -f "/opt/salaryneeds/target/salaryneeds-0.0.1-SNAPSHOT.jar" ]; then
              sudo mv /opt/salaryneeds/target/salaryneeds-0.0.1-SNAPSHOT.jar /opt/salaryneeds/salaryneeds-0.0.1-SNAPSHOT.jar
            fi

            echo "Checking deployed JAR..."
            ls -lh /opt/salaryneeds/salaryneeds-0.0.1-SNAPSHOT.jar

            echo "Setting ownership..."
            sudo chown ec2-user:ec2-user /opt/salaryneeds/salaryneeds-0.0.1-SNAPSHOT.jar
            sudo chmod 755 /opt/salaryneeds/salaryneeds-0.0.1-SNAPSHOT.jar

            echo "Starting SalaryNeeds..."
            sudo systemctl start salaryneeds

            echo "Waiting for application..."
            sleep 20

            echo "Checking service..."
            sudo systemctl status salaryneeds -l --no-pager

            echo "Checking port 8080..."
            sudo ss -lntp | grep 8080

            echo "Checking health..."
            curl -f http://localhost:8080/actuator/health
