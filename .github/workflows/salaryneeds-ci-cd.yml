name: SalaryNeeds CI/CD

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Build Spring Boot application
      - name: Build application
        run: mvn clean package -DskipTests

      # 4. Stop application and prepare EC2 directory
      - name: Prepare EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Stopping SalaryNeeds..."
            sudo systemctl stop salaryneeds || true

            echo "Ensuring directory exists with proper permissions..."
            sudo mkdir -p /opt/salaryneeds
            sudo chown -R ec2-user:ec2-user /opt/salaryneeds
            sudo chmod 755 /opt/salaryneeds

            echo "Removing old JAR..."
            sudo rm -f /opt/salaryneeds/salaryneeds-0.0.1-SNAPSHOT.jar
            sudo rm -rf /opt/salaryneeds/target

      # 5. Copy new JAR directly to EC2
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/salaryneeds-0.0.1-SNAPSHOT.jar"
          target: "/opt/salaryneeds"
          strip_components: 1
          overwrite: true

      # 6. Configure Supabase PostgreSQL credentials on EC2
      - name: Configure database environment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Configuring Supabase PostgreSQL environment on EC2..."
            SUPABASE_SECRET="${{ secrets.SUPABASE_DB_PASSWORD }}"
            DB_PASS="${SUPABASE_SECRET:-Salaryneeds12@}"
            sudo mkdir -p /opt/salaryneeds
            printf "DB_URL=jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require&prepareThreshold=0\nDB_USER=postgres.jbgctbgqymrdurkumwes\nDB_PASSWORD=%s\nDB_DRIVER=org.postgresql.Driver\nSPRING_JPA_HIBERNATE_DDL_AUTO=update\nSERVER_PORT=8080\n" "$DB_PASS" | sudo tee /opt/salaryneeds/salaryneeds.env > /dev/null
            sudo chown ec2-user:ec2-user /opt/salaryneeds/salaryneeds.env
            sudo chmod 600 /opt/salaryneeds/salaryneeds.env

            printf "[Unit]\nDescription=SalaryNeeds Spring Boot Application\nAfter=network.target\n\n[Service]\nType=simple\nUser=ec2-user\nWorkingDirectory=/opt/salaryneeds\nEnvironmentFile=/opt/salaryneeds/salaryneeds.env\nExecStart=/usr/bin/java -jar /opt/salaryneeds/salaryneeds-0.0.1-SNAPSHOT.jar\nRestart=on-failure\nRestartSec=10\nStandardOutput=journal\nStandardError=journal\n\n[Install]\nWantedBy=multi-user.target\n" | sudo tee /etc/systemd/system/salaryneeds.service > /dev/null
            sudo systemctl daemon-reload

      # 7. Start application and verify health
      - name: Start and verify SalaryNeeds
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Checking deployed JAR..."
            ls -lh /opt/salaryneeds/salaryneeds-0.0.1-SNAPSHOT.jar

            echo "Setting ownership..."
            sudo chown ec2-user:ec2-user /opt/salaryneeds/salaryneeds-0.0.1-SNAPSHOT.jar
            sudo chmod 755 /opt/salaryneeds/salaryneeds-0.0.1-SNAPSHOT.jar

            echo "Starting SalaryNeeds with Supabase PostgreSQL..."
            sudo systemctl restart salaryneeds

            echo "Waiting for application to become healthy..."
            HEALTHY=0
            for i in {1..30}; do
              if curl -s -f http://localhost:8080/actuator/health > /dev/null; then
                (curl -s http://localhost:8080/actuator/health | python3 -m json.tool 2>/dev/null) || curl -s http://localhost:8080/actuator/health
                echo ""
                HEALTHY=1
                break
              fi
              echo "Waiting for app to start... ($i/30)"
              sleep 5
            done

            if [ $HEALTHY -eq 0 ]; then
              echo "Health check failed! Service status and recent logs:"
              sudo systemctl status salaryneeds -l --no-pager || true
              sudo journalctl -u salaryneeds.service -n 80 --no-pager || true
              exit 1
            fi

