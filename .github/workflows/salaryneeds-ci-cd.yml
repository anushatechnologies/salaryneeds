name: SalaryNeeds CI/CD

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Build Spring Boot application
      - name: Build application
        run: mvn clean package -DskipTests

      # 4. Copy NEW JAR to EC2 /tmp
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/salaryneeds-0.0.1-SNAPSHOT.jar"
          target: "/tmp"
          overwrite: true

      # 5. Deploy NEW JAR and restart application
      - name: Deploy and restart SalaryNeeds
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Stopping SalaryNeeds..."
            sudo systemctl stop salaryneeds

            echo "Removing old JAR..."
            sudo rm -f /opt/salaryneeds/salaryneeds-0.0.1-SNAPSHOT.jar

            echo "Copying new JAR..."
            sudo cp /tmp/salaryneeds-0.0.1-SNAPSHOT.jar /opt/salaryneeds/salaryneeds-0.0.1-SNAPSHOT.jar

            echo "Setting ownership..."
            sudo chown ec2-user:ec2-user /opt/salaryneeds/salaryneeds-0.0.1-SNAPSHOT.jar

            echo "Checking deployed JAR..."
            ls -lh /opt/salaryneeds/salaryneeds-0.0.1-SNAPSHOT.jar

            echo "Starting SalaryNeeds..."
            sudo systemctl start salaryneeds

            echo "Waiting for application..."
            sleep 15

            echo "Checking service status..."
            sudo systemctl status salaryneeds -l --no-pager

            echo "Checking port 8080..."
            sudo ss -lntp | grep 8080

            echo "Checking health..."
            curl -f http://localhost:8080/actuator/health
