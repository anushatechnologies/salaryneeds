name: SalaryNeeds CI/CD

on:
  push:
    branches:
      - master
      - main

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Build Spring Boot application
      - name: Build application
        run: mvn clean package -DskipTests

      # 4. Stop application, prepare directory, and remove old JAR
      - name: Prepare EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Stopping SalaryNeeds..."
            sudo systemctl stop salaryneeds || true

            echo "Ensuring /opt/salaryneeds exists and is writable by ec2-user..."
            sudo mkdir -p /opt/salaryneeds
            sudo chown -R ec2-user:ec2-user /opt/salaryneeds

            echo "Removing old JAR..."
            rm -f /opt/salaryneeds/salaryneeds-0.0.1-SNAPSHOT.jar
            rm -rf /opt/salaryneeds/target

            echo "Checking directory..."
            ls -la /opt/salaryneeds

      # 5. Copy new JAR directly to EC2
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/salaryneeds-0.0.1-SNAPSHOT.jar"
          target: "/opt/salaryneeds"
          strip_components: 1
          overwrite: true

      # 6. Start application and verify health
      - name: Start and verify SalaryNeeds
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Checking deployed JAR..."
            ls -lh /opt/salaryneeds/salaryneeds-0.0.1-SNAPSHOT.jar

            echo "Setting ownership..."
            sudo chown ec2-user:ec2-user /opt/salaryneeds/salaryneeds-0.0.1-SNAPSHOT.jar

            echo "Restarting SalaryNeeds service..."
            sudo systemctl restart salaryneeds

            echo "Polling health endpoint until application is fully initialized..."
            RETRY=0
            MAX_RETRIES=30
            SUCCESS=0

            while [ $RETRY -lt $MAX_RETRIES ]; do
              if curl -s -f http://localhost:8083/actuator/health > /dev/null 2>&1 || curl -s -f http://localhost:8080/actuator/health > /dev/null 2>&1; then
                echo "✅ SalaryNeeds is UP and HEALTHY!"
                SUCCESS=1
                break
              fi
              echo "Application is starting up... (attempt $((RETRY+1))/$MAX_RETRIES - waiting 3s)"
              sleep 3
              RETRY=$((RETRY+1))
            done

            if [ $SUCCESS -ne 1 ]; then
              echo "❌ Health check timed out after 90s. Service logs:"
              sudo systemctl status salaryneeds -l --no-pager || true
              sudo journalctl -u salaryneeds -n 50 --no-pager || true
              exit 1
            fi

            echo "Listening Ports:"
            sudo ss -lntp | grep -E "8083|8080" || true

            echo "Health check response:"
            curl -s http://localhost:8083/actuator/health || curl -s http://localhost:8080/actuator/health
