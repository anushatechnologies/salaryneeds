name: Pull Request Quality Gate

on:
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  validate-pr:
    name: 🛡️ PR Code Quality & Test Validation
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Pull Request Branch
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: ⚙️ Verify Code Compilation
        run: mvn clean compile -B

      - name: 🧪 Execute All Unit & Edge Case Integration Tests
        run: mvn test -B

      - name: 🔍 Verify Flyway Migration Scripts
        run: |
          echo "Verifying SQL Migration syntax in src/main/resources/db/migration/..."
          ls -la src/main/resources/db/migration/

      - name: 📊 Check Test Results
        uses: scacap/action-surefire-report@v1
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          report_paths: '**/surefire-reports/TEST-*.xml'
