spring.application.name=salaryneeds

# PostgreSQL / Supabase
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=8080

# Actuator Health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Admin JWT
admin.jwt.secret=${ADMIN_JWT_SECRET:c2FsYXJ5bmVlZHMtYWRtaW4tc3VwZXItc2VjcmV0LWtleS0yMDI2LWNoYW5nZS1pbi1wcm9k}
admin.jwt.expiration-ms=86400000

# Supabase Storage S3 Configuration
supabase.s3.endpoint=${SUPABASE_S3_ENDPOINT:https://jbgctbgqymrdurkumwes.storage.supabase.co/storage/v1/s3}
supabase.s3.region=${SUPABASE_S3_REGION:ap-south-1}
supabase.s3.access-key-id=${SUPABASE_S3_ACCESS_KEY_ID:}
supabase.s3.secret-access-key=${SUPABASE_S3_SECRET_ACCESS_KEY:}
supabase.catalog.bucket=${SUPABASE_CATALOG_BUCKET:salaryneeds}

# Multipart upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB