spring.application.name=salaryneeds

# Server
server.port=${SERVER_PORT:8081}

# Datasource (Persistent Disk Database by default, external PostgreSQL when DB_URL is set)
spring.datasource.url=${DB_URL:jdbc:h2:file:./salaryneeds_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:salaryneeds}
spring.datasource.password=${DB_PASSWORD:SalaryNeeds123@}
# If DB_DRIVER is not set, Spring Boot auto-detects from the JDBC URL (PostgreSQL vs H2)
spring.datasource.driver-class-name=${DB_DRIVER:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:${HIBERNATE_DDL_AUTO:update}}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Flyway (disabled by default for local H2 auto-ddl dev mode)
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Actuator Health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Jackson / JSON configuration for frontend resilience
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null


# Google Maps API
google.maps.api.key=${GOOGLE_MAPS_API_KEY:AIzaSyAJfaQLhzeEpekoZb8SJwYkoogodbXbr-o}

# Admin JWT Configuration
admin.jwt.secret=${ADMIN_JWT_SECRET:salaryneeds-super-secure-admin-jwt-secret-key-must-be-256-bits-long-2026}
admin.jwt.expiration-ms=${ADMIN_JWT_EXPIRATION_MS:86400000}

# Supabase Storage S3 Configuration
supabase.s3.endpoint=${SUPABASE_S3_ENDPOINT:https://jbgctbgqymrdurkumwes.storage.supabase.co/storage/v1/s3}
supabase.s3.region=${SUPABASE_S3_REGION:ap-south-1}
supabase.s3.access-key-id=${SUPABASE_S3_ACCESS_KEY_ID:117f2a0ea478df222e2c677d2fe1053b}
supabase.s3.secret-access-key=${SUPABASE_S3_SECRET_ACCESS_KEY:88093c7bf9fc7a1bf35a22cc01548d6f4f773a97475c9bc917ecee9d043a2b07}
supabase.catalog.bucket=${SUPABASE_CATALOG_BUCKET:salaryneeds}

# AWS SDK Credentials
aws.accessKeyId=${AWS_ACCESS_KEY_ID:117f2a0ea478df222e2c677d2fe1053b}
aws.secretKey=${AWS_SECRET_ACCESS_KEY:88093c7bf9fc7a1bf35a22cc01548d6f4f773a97475c9bc917ecee9d043a2b07}

# Storage Public Base URL
storage.public.base-url=${STORAGE_PUBLIC_BASE_URL:}

# API and CORS Configuration
app.api.base-url=${APP_API_BASE_URL:https://api.anjibabujob.com}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://api.anjibabujob.com,https://anjibabujob.com,https://*.anjibabujob.com,http://localhost:*,http://127.0.0.1:*,http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:8081,http://localhost:8080}

# Spring Boot Configuration
spring.main.allow-bean-definition-overriding=true
