spring.application.name=salaryneeds

# PostgreSQL / Supabase Datasource (Production / Remote)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Actuator Health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Server
server.port=8080

# Jackson / JSON configuration for frontend resilience
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null

# Google Maps API
google.maps.api.key=${GOOGLE_MAPS_API_KEY:AIzaSyAJfaQLhzeEpekoZb8SJwYkoogodbXbr-o}