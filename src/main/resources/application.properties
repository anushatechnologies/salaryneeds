spring.application.name=salaryneeds

# Server
server.port=${SERVER_PORT:8080}

# Datasource (supports local MySQL and remote PostgreSQL/Supabase via environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:salaryneeds}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Actuator Health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Jackson / JSON configuration for frontend resilience
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null

# AWS S3 Configuration
aws.s3.bucket-name=${S3_BUCKET_NAME:salaryneeds-kyc}
aws.s3.region=${AWS_REGION:ap-south-1}

# Google Maps API
google.maps.api.key=${GOOGLE_MAPS_API_KEY:AIzaSyAJfaQLhzeEpekoZb8SJwYkoogodbXbr-o}
