spring.application.name=salaryneeds

# Server
server.port=${SERVER_PORT:8083}

# Database Configuration (supports H2 file-based by default for immediate plug-and-play, or PostgreSQL / MySQL via env)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/salaryneeds;AUTO_SERVER=TRUE;MODE=PostgreSQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# Flyway (disabled by default so JPA manages entities automatically across environments)
spring.flyway.enabled=false

# AWS S3 Configuration
aws.s3.bucket-name=${S3_BUCKET_NAME:salaryneeds-kyc}
aws.s3.region=${AWS_REGION:ap-south-1}

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always