spring.application.name=salaryneeds

# Server
server.port=${SERVER_PORT:8080}

# Datasource (PostgreSQL remote with H2 fallback for local dev)
spring.datasource.url=${DB_URL:jdbc:h2:mem:salaryneeds;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Flyway (disabled by default for local H2 auto-ddl dev mode)
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Actuator Health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Jackson / JSON configuration for frontend resilience
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null


# Google Maps API
google.maps.api.key=${GOOGLE_MAPS_API_KEY:AIzaSyAJfaQLhzeEpekoZb8SJwYkoogodbXbr-o}

# Admin JWT Configuration
admin.jwt.secret=${ADMIN_JWT_SECRET:salaryneeds-super-secure-admin-jwt-secret-key-must-be-256-bits-long-2026}
admin.jwt.expiration-ms=${ADMIN_JWT_EXPIRATION_MS:86400000}

# Supabase Storage S3 Configuration
supabase.s3.endpoint=${SUPABASE_S3_ENDPOINT:https://jbgctbgqymrdurkumwes.storage.supabase.co/storage/v1/s3}
supabase.s3.region=${SUPABASE_S3_REGION:ap-south-1}
supabase.s3.access-key-id=${SUPABASE_S3_ACCESS_KEY_ID:}
supabase.s3.secret-access-key=${SUPABASE_S3_SECRET_ACCESS_KEY:}
supabase.catalog.bucket=${SUPABASE_CATALOG_BUCKET:salaryneeds}

# Spring Boot Configuration
spring.main.allow-bean-definition-overriding=true


