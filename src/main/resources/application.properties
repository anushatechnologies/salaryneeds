spring.application.name=salaryneeds

# Server
server.port=${SERVER_PORT:8080}

# Datasource Configuration (Defaults to persistent local file DB with PostgreSQL mode for instant local running, or remote PostgreSQL when env vars are provided)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/salaryneeds;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway (only enabled when explicitly configured)
spring.flyway.enabled=${FLYWAY_ENABLED:false}

# Actuator Health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Jackson / JSON configuration for frontend resilience
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null

# AWS S3 Configuration
aws.s3.bucket-name=${S3_BUCKET_NAME:salaryneeds-kyc}
aws.s3.region=${AWS_REGION:ap-south-1}

# Google Maps API
google.maps.api.key=${GOOGLE_MAPS_API_KEY:AIzaSyAJfaQLhzeEpekoZb8SJwYkoogodbXbr-o}
