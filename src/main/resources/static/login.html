<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - SalaryNeeds Service Marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(18, 26, 43, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-glow: rgba(59, 130, 246, 0.12);
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --input-bg: rgba(15, 23, 42, 0.6);
      --input-border: rgba(148, 163, 184, 0.16);
      --input-focus: #3b82f6;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.12);
      --radius-lg: 16px;
      --radius-md: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 20% 15%, rgba(37, 99, 235, 0.15) 0%, transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(99, 102, 241, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.8) 0%, transparent 100%);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient background shapes */
    .ambient-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
    }
    .glow-1 {
      width: 400px;
      height: 400px;
      background: rgba(59, 130, 246, 0.18);
      top: -100px;
      left: 10%;
    }
    .glow-2 {
      width: 350px;
      height: 350px;
      background: rgba(139, 92, 246, 0.15);
      bottom: -80px;
      right: 15%;
    }

    /* Main Card Container */
    .login-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      animation: fadeInCard 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeInCard {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .login-card {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.05),
        0 0 40px var(--card-glow);
      padding: 40px 36px;
    }

    /* Brand Header */
    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.25);
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      color: #60a5fa;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .brand-badge svg {
      width: 12px;
      height: 12px;
    }

    .header-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .header-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-dim);
      pointer-events: none;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }

    .input-wrapper:focus-within .input-icon {
      color: var(--primary);
    }

    .form-input {
      width: 100%;
      height: 48px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-md);
      padding: 0 16px 0 44px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input::placeholder {
      color: var(--text-dim);
    }

    .form-input:focus {
      border-color: var(--input-focus);
      background: rgba(15, 23, 42, 0.85);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    .toggle-password-btn {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 6px;
      border-radius: 6px;
      transition: color 0.2s;
    }

    .toggle-password-btn:hover {
      color: var(--text-main);
    }

    /* Options / Demo Pill */
    .form-extra {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 12px;
    }

    .demo-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px dashed rgba(148, 163, 184, 0.3);
      padding: 6px 12px;
      border-radius: 6px;
      color: #93c5fd;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
      font-size: 12px;
    }

    .demo-pill:hover {
      background: rgba(59, 130, 246, 0.15);
      border-color: #3b82f6;
      color: #ffffff;
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      height: 48px;
      background: var(--primary-gradient);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .btn-submit:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.55);
      background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
    }

    .btn-submit:active:not(:disabled) {
      transform: translateY(1px);
    }

    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    /* Spinner */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Alert Banner */
    .alert-banner {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      font-size: 13px;
      margin-bottom: 20px;
      animation: shake 0.35s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .alert-danger {
      background: var(--danger-bg);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .alert-success {
      background: var(--success-bg);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
      animation: none;
    }

    /* Footer Info */
    .card-footer {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      text-align: center;
      font-size: 12px;
      color: var(--text-dim);
    }

    .footer-secure {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <!-- Ambient Glow Backgrounds -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="login-wrapper">
    <div class="login-card">
      
      <!-- Brand & Header -->
      <div class="brand-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <span>Admin Portal</span>
      </div>

      <h1 class="header-title">Admin Login</h1>
      <p class="header-subtitle">Sign in to manage workers, bookings, coupons, and reviews.</p>

      <!-- Alert Notification Banner -->
      <div id="alertBanner" class="alert-banner" role="alert">
        <svg id="alertIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
        <span id="alertMessage"></span>
      </div>

      <!-- Login Form -->
      <form id="loginForm" novalidate>

        <!-- Email Field -->
        <div class="form-group">
          <label for="email" class="form-label">Admin Email</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="20" height="16" x="2" y="4" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
            </span>
            <input 
              type="email" 
              id="email" 
              name="email" 
              class="form-input" 
              placeholder="admin@salaryneeds.com" 
              autocomplete="email" 
              required 
            />
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-input" 
              placeholder="••••••••••••" 
              autocomplete="current-password" 
              required 
            />
            <button type="button" id="togglePasswordBtn" class="toggle-password-btn" title="Toggle password visibility">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Extra Helper / Demo Fill -->
        <div class="form-extra">
          <span class="demo-pill" id="demoFillBtn" title="Click to auto-populate default demo admin credentials">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
            </svg>
            <span>Auto-Fill Demo Credentials</span>
          </span>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="loginBtn" class="btn-submit">
          <span class="spinner" id="btnSpinner"></span>
          <span id="btnText">Sign In to Dashboard</span>
          <svg id="btnArrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>

      </form>

      <!-- Footer -->
      <div class="card-footer">
        <div class="footer-secure">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <span>End-to-end encrypted admin session (JWT role verification)</span>
        </div>
      </div>

    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const btnSpinner = document.getElementById('btnSpinner');
    const btnText = document.getElementById('btnText');
    const btnArrow = document.getElementById('btnArrow');
    const alertBanner = document.getElementById('alertBanner');
    const alertMessage = document.getElementById('alertMessage');
    const alertIcon = document.getElementById('alertIcon');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const eyeIcon = document.getElementById('eyeIcon');
    const demoFillBtn = document.getElementById('demoFillBtn');

    // Toggle password visibility
    togglePasswordBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      eyeIcon.innerHTML = isPassword
        ? '<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/>'
        : '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
    });

    // Auto-fill demo credentials
    demoFillBtn.addEventListener('click', () => {
      emailInput.value = 'admin@salaryneeds.com';
      passwordInput.value = 'Admin@1234';
      hideAlert();
      passwordInput.focus();
    });

    // Display Alert Helper
    function showAlert(msg, type = 'danger') {
      alertBanner.className = 'alert-banner ' + (type === 'danger' ? 'alert-danger' : 'alert-success');
      alertMessage.textContent = msg;
      alertIcon.innerHTML = type === 'danger'
        ? '<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>'
        : '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>';
      alertBanner.style.display = 'flex';
    }

    function hideAlert() {
      alertBanner.style.display = 'none';
    }

    function setLoading(isLoading) {
      loginBtn.disabled = isLoading;
      emailInput.disabled = isLoading;
      passwordInput.disabled = isLoading;
      btnSpinner.style.display = isLoading ? 'inline-block' : 'none';
      btnArrow.style.display = isLoading ? 'none' : 'inline-block';
      btnText.textContent = isLoading ? 'Authenticating...' : 'Sign In to Dashboard';
    }

    // Form Submission Handler
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      // Basic client validation
      if (!email || !password) {
        showAlert('Please enter both email and password.');
        return;
      }

      setLoading(true);

      try {
        // Attempt POST /api/admin/auth/login, with fallback to /auth/login
        let response;
        try {
          response = await fetch('/api/admin/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
        } catch (err) {
          response = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
        }

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          const message = errData.message || errData.error || 'Invalid credentials or access denied.';
          showAlert(message);
          setLoading(false);
          return;
        }

        const data = await response.json();

        // 1. JWT received & Check role = ADMIN
        if (data.role && data.role !== 'ADMIN') {
          showAlert('Unauthorized. Only administrators are permitted to sign in.');
          setLoading(false);
          return;
        }

        // 2. Store token & admin info in storage
        if (data.token) {
          localStorage.setItem('adminToken', data.token);
          sessionStorage.setItem('adminToken', data.token);
        }
        if (data.adminId) {
          localStorage.setItem('adminId', data.adminId);
        }
        if (data.name) {
          localStorage.setItem('adminName', data.name);
        }
        if (data.email) {
          localStorage.setItem('adminEmail', data.email);
        }
        if (data.role) {
          localStorage.setItem('adminRole', data.role);
        }

        // 3. Success feedback & Navigate -> /admin/dashboard
        showAlert('Authentication verified! Redirecting to dashboard...', 'success');
        
        setTimeout(() => {
          // If frontend is on localhost:5173, prefer Vite admin dashboard, else local route
          if (window.location.port === '5173') {
            window.location.href = '/admin/dashboard';
          } else {
            // Check if Vite server is running or route locally
            fetch('http://localhost:5173/admin/dashboard', { mode: 'no-cors' })
              .then(() => {
                window.location.href = 'http://localhost:5173/admin/dashboard';
              })
              .catch(() => {
                window.location.href = '/admin/dashboard';
              });
          }
        }, 800);

      } catch (networkError) {
        console.error('Login error:', networkError);
        showAlert('Cannot reach the backend server. Please verify the application is running.');
        setLoading(false);
      }
    });
  </script>
</body>
</html>
