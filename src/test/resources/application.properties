spring.application.name=salaryneeds-test

# Test In-Memory Datasource
spring.datasource.url=jdbc:h2:mem:salaryneeds;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway disabled for tests
spring.flyway.enabled=false

# Test Admin JWT secret
admin.jwt.secret=salaryneeds-super-secure-admin-jwt-secret-key-must-be-256-bits-long-2026
admin.jwt.expiration-ms=86400000
spring.main.allow-bean-definition-overriding=true
