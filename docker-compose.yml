version: '3.8'

services:
  # MySQL Database Service
  salaryneeds-db:
    image: mysql:8.0
    container_name: salaryneeds-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-salaryneeds}
    ports:
      - "${MYSQL_HOST_PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - salaryneeds-network

  # SalaryNeeds Spring Boot Backend Service
  salaryneeds-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salaryneeds-backend
    restart: unless-stopped
    depends_on:
      salaryneeds-db:
        condition: service_healthy
    environment:
      DB_HOST: salaryneeds-db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-salaryneeds}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - salaryneeds-network

volumes:
  mysql_data:
    driver: local

networks:
  salaryneeds-network:
    driver: bridge

